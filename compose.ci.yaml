name: coderr-ci

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coderr_ci
      POSTGRES_USER: coderr_ci
      POSTGRES_PASSWORD: coderr_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coderr_ci -d coderr_ci"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ci-only-9f7c2a4e6d8b1f3a5c7e9d2b4f6a8c1e3d5b7f9a2c4e6d8b1f3a5c7e9d2b4f6a
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DB_NAME: coderr_ci
      DB_USER: coderr_ci
      DB_PASSWORD: coderr_ci
      DB_HOST: db
      DB_PORT: "5432"
      COVERAGE_FILE: /tmp/.coverage
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        python -m pip check &&
        python manage.py check &&
        DJANGO_DEBUG=False \
        DJANGO_SECURE_SSL_REDIRECT=True \
        DJANGO_SECURE_HSTS_SECONDS=31536000 \
        DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
        DJANGO_SECURE_HSTS_PRELOAD=True \
        python manage.py check --deploy --fail-level WARNING &&
        coverage erase &&
        coverage run --source=auth_app,offers_app,orders_app,reviews_app,core manage.py test &&
        coverage report --fail-under=90
