services:
  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be configured}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: ${APP_IMAGE:?APP_IMAGE must point to a published Coderr image}
    env_file: .env
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${MEDIA_DIR:-./media}:/app/media
      - coderr_static:/app/staticfiles
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  coderr_static:
