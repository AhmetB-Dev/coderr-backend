[tool.ruff]
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "**/migrations/**",
]

[tool.ruff.lint.per-file-ignores]
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/api/views.py" = ["RUF012"]
"**/api/filters.py" = ["RUF012"]
"**/api/serializers.py" = ["RUF012"]
